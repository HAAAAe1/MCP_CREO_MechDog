[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = [
    ".tmp", "build", "jobs", "models", "native/third_party",
]

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Existing standalone scripts locate the source checkout before importing it.
"tools/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"seed_library/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
