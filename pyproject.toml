[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MCP_CREO_MechDog"
dynamic = ["version"]
description = "Local Creo Toolkit MCP service, installed from a source checkout"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools]
packages = ["creo_mechdog"]
py-modules = ["version", "schema", "airfoil", "profile_checks"]
package-dir = {creo_mechdog = "src/creo_mechdog"}

[tool.setuptools.dynamic]
version = {attr = "version.VERSION"}

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = [
    ".tmp", "build", "jobs", "models", "native/third_party",
    # Archived external evidence must retain its original bytes, including code fences.
    "docs/validation",
]

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Existing standalone scripts locate the source checkout before importing it.
"tools/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"seed_library/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
